  npc:
    # Скины игроков на NPC плагина Citizens.
    # Включить/выключить модуль. Применить без рестарта: /amazakecore reload.
    enabled: true
    # Модулю нужен плагин Citizens (мягкая зависимость через рефлексию).
    # Если Citizens не установлен, модуль остаётся включённым, но бездействует,
    # а в консоль выводится понятное предупреждение.
    require-citizens: true
