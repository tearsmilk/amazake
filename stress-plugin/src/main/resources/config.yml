# ============================================================================
#  AmazakeStress — воспроизводимый стресс-тест для серверов на базе Paper 1.21.11
# ----------------------------------------------------------------------------
#  Главное правило честного сравнения: на ОБОИХ серверах должен лежать
#  ОДИНАКОВЫЙ config.yml. Одинаковый конфиг = одинаковый мир, одинаковые
#  постройки по тем же координатам, одинаковые случайные решения (общий seed)
#  и одинаковое расписание этапов в тиках.
#
#  Конфиг перечитывается при каждом /stress start, перезапуск сервера не нужен.
#  Плагин работает ТОЛЬКО в своём мире stress_world и никогда не трогает
#  остальные миры сервера.
# ============================================================================

# Версия формата конфига (не менять вручную).
config-version: 1

world:
  # Сид тестового мира. Должен совпадать на обоих серверах.
  seed: 20261111
  # Тип мира: FLAT (плоский, рекомендуется — рельеф не влияет на постройки)
  # или NORMAL / LARGE_BIOMES / AMPLIFIED.
  type: FLAT
  # Настройки генератора (JSON) для FLAT. Пусто = стандартный плоский мир
  # (бедрок y=-64, земля, трава y=-61).
  generator-settings: ""
  # Высота, с которой модули начинают строить. auto = для FLAT на блок выше
  # травы (y=-60), для остальных типов y=120.
  build-y: auto
  # Пересоздавать мир перед каждым запуском, если он уже использовался.
  # true = каждый прогон начинается с одинакового чистого мира (рекомендуется).
  recreate-on-start: true
  # Сложность. Не PEACEFUL — иначе враждебные мобы исчезают.
  difficulty: NORMAL
  # Зафиксированное время суток (6000 = полдень) и ясная погода.
  time: 6000
  # Автосохранение мира stress_world (false = меньше случайной нагрузки на диск).
  auto-save: false
  # Правила игры (gamerules) для stress_world. Имена — новые, из 1.21.11
  # (snake_case). Значения — true/false или число.
  gamerules:
    spawn_mobs: false               # естественный спавн выключен: живут только наши мобы
    spawn_monsters: false
    spawn_patrols: false
    spawn_phantoms: false
    spawn_wandering_traders: false
    spawn_wardens: false
    raids: false
    advance_time: false             # день не сменяется
    advance_weather: false          # погода не меняется
    random_tick_speed: 3            # стандартная скорость случайных тиков
    mob_griefing: false             # мобы не ломают постройки
    mob_drops: false                # нет лишних предметов с мобов
    max_entity_cramming: 0          # мобы не умирают от тесноты (число мобов стабильно)
    fire_spread_radius_around_player: 0
    send_command_feedback: true
    show_death_messages: false
    show_advancement_messages: false

# ----------------------------------------------------------------------------
#  Расписание этапов. Все длительности в секундах, внутри считаются в тиках
#  (1 с = 20 тиков). Нагрузка нарастает: включённая на этапе нагрузка
#  остаётся активной до конца прогона.
#    0 baseline — без нагрузки (замер «пустого» сервера)
#    1 mobs     — мобы
#    2 physics  — физика (падающие блоки, вода, TNT ...)
#    3 redstone — редстоун-часы и цепочки воронок
#    4 chunks   — загрузка/выгрузка/генерация чанков
#    5 packets  — пакеты + асинхронная нагрузка плагина (модуль async)
#                 + проверка гонок (модуль races)
#    6 max      — всё на максимуме до конца прогона
# ----------------------------------------------------------------------------
timeline:
  # Общая длительность по умолчанию (если в /stress start не указано время).
  total-seconds: 300
  stages:
    baseline: 20
    mobs: 30
    physics: 30
    redstone: 30
    chunks: 30
    packets: 30
  # Этап max длится всё оставшееся время, но не меньше этого значения.
  # Если общее время слишком короткое, этапы 0–5 пропорционально сжимаются.
  min-max-stage-seconds: 30
  # Множитель интенсивности на этапе max (модули читают его через
  # StressContext#intensity()). 1.0 = без усиления.
  max-stage-multiplier: 1.5

status:
  # Как часто писать краткий статус в консоль во время прогона (секунды, 0 = никогда).
  log-interval-seconds: 10
  # Сообщать администраторам (stress.admin) о смене этапа.
  broadcast-stage-changes: true
  # Сохранять итоговую сводку в plugins/AmazakeStress/results/.
  save-results: true

profiler:
  # Автоматически запускать встроенный профайлер вместе с /stress start
  # и останавливать его ровно в конце прогона (отчёт покрывает весь прогон).
  # false = запускайте /stress profile <секунды> вручную.
  auto-start-with-run: false
  # Куда отправлять отчёт (POST /api/reports, как у /amazake profile). Пусто =
  # только сохранять в plugins/AmazakeStress/profiles/. При ошибке отправки отчёт
  # тоже сохраняется туда; его можно перетащить на страницу сайта.
  upload-url: "https://mc-ru.org"
  # Токен сайта (заголовок X-Amazake-Token), если сайт его требует.
  upload-token: ""
  # Интервал выборки, мс (250–10000).
  interval-ms: 1000
  # Максимальная длительность одного замера, секунды.
  max-seconds: 7200

# ----------------------------------------------------------------------------
#  Модули нагрузки. У каждого: enabled (участвует ли в /stress start all)
#  и свои параметры интенсивности. Значения по умолчанию подобраны так,
#  чтобы довести 3-ядерную машину до предела.
# ----------------------------------------------------------------------------
modules:
  mobs:
    enabled: true
    # Сколько мобов всего (на этапе max — count × max-stage-multiplier).
    count: 800
    # Сколько мобов спавнить за тик (плавный разгон, без одного огромного скачка).
    spawn-per-tick: 20
    # Бюджет установки блоков за тик при постройке загонов (стройка не должна
    # выглядеть как лаг в замере).
    build-blocks-per-tick: 2000
    # Доли мобов (веса, не обязательно в сумме 100). Загоны: 2x2 чанка каждый.
    mix:
      zombie: 18          # зомби (не горят на солнце)
      skeleton: 12        # скелеты без цели (не горят на солнце)
      villager: 10        # жители: верстаки и кровати → поиск POI, «мозг»
      iron-golem: 2       # големы в деревенских загонах
      farm: 26            # фермерские животные парами, их кормят через API → размножение
      bee: 6              # пчёлы с ульями и цветами (загон с крышей)
      piglin: 8           # пиглины (без превращения в зомби)
      crammed: 18         # теснота: мобы в маленьких загонах → коллизии
    # Сколько загонов каждого типа (влияет на координаты построек).
    pens:
      zombie: 2
      skeleton: 2
      village: 2
      farm: 3
      bee: 1
      piglin: 1
      crammed: 4
    # Сторона загона внутри (6–28 блоков) и высота стен.
    pen-size: 28
    wall-height: 4
    # Сторона «тесного» загона (блоков).
    crammed-pen-size: 3
    # Животные ферм (пары одного вида) и тесных загонов. Названия — EntityType.
    farm-animals: [COW, SHEEP, CHICKEN, PIG]
    crammed-animals: [COW, SHEEP]
    # Как часто мобам выдаются новые цели движения (тики), какой доле мобов
    # и с какой скоростью (Pathfinder#moveTo).
    retarget-interval-ticks: 40
    retarget-share: 0.5
    retarget-speed: 1.0
    # Как часто кормить животных (тики) и максимум живых детёнышей.
    breed-interval-ticks: 300
    max-babies: 120

  physics:
    enabled: true
    # Бюджет установки блоков за тик (стройка и перестановка колонн).
    build-blocks-per-tick: 2000
    # Падающие блоки: колонны стоят на опоре над пустотой; каждые interval-ticks
    # колонны ставятся заново, и все опоры убираются в один тик → обрушение.
    falling:
      columns: 256
      column-height: 24
      drop-height: 6            # высота пустоты под колонной
      interval-ticks: 120
      materials: [SAND, RED_SAND, GRAVEL, WHITE_CONCRETE_POWDER, LIME_CONCRETE_POWDER, BLUE_CONCRETE_POWDER]
    # Предметы на земле: «залпы» кучками (сливаются), удаляются через lifetime-ticks.
    items:
      per-burst: 600
      interval-ticks: 100
      lifetime-ticks: 400
      per-cluster: 12
      materials: [COBBLESTONE, DIRT, OAK_LOG, WHEAT_SEEDS, BONE, ROTTEN_FLESH, IRON_INGOT, STICK]
    # Сферы опыта: залпы кучками по 10 (сливаются), удаляются через lifetime-ticks.
    xp:
      orbs-per-burst: 200
      interval-ticks: 60
      lifetime-ticks: 300
    # Жидкости: источники воды/лавы на столбах в отдельных ячейках 16x16,
    # включаются на on-ticks и выключаются на off-ticks (растекание и отступание).
    fluids:
      sources: 64
      lava-share: 0.25
      on-ticks: 100
      off-ticks: 60
    # Раздатчики со стрелами, стреляют в стену через API.
    arrows:
      dispensers: 32
      interval-ticks: 20
      range: 16
    # TNT в обсидиановой камере (по умолчанию ВЫКЛЮЧЕНО). Блоки не разрушаются.
    tnt:
      enabled: false
      per-wave: 40
      interval-ticks: 100
      fuse-ticks: 40
      yield: 2.0

  redstone:
    enabled: true
    # Все постройки строятся в своей области stress_world по фиксированным
    # координатам и запускаются сами (последний блок ставится с физикой).
    # На этапе max добавляются ещё постройки: count × timeline.max-stage-multiplier
    # (место под них резервируется заранее, координаты не меняются).
    #
    # --- Часы: чётные — часы на двух обсерверах (самые быстрые), нечётные —
    # кольцо из факела и повторителей. Каждые часы гонят длинную линию
    # редстоун-пыли по лампам (пересчёт пыли и переключение ламп — основная нагрузка).
    clocks: 40
    # Длина линии пыли/ламп у каждых часов (повторитель каждые 12 блоков).
    clock-length: 64
    # Задержка повторителей в кольце часов (1–4). Полупериод = 2 + 8 × задержка тиков.
    clock-ring-delay: 1
    # Задержка повторителей-усилителей в линиях (1–4).
    line-repeater-delay: 1
    #
    # --- Стены поршней: часы + линия по лампам, вдоль линии с двух сторон
    # липкие поршни двигают блоки слизи/мёда с камнем сверху.
    piston-walls: 16
    # Длина стены (блоков вдоль линии; поршней примерно 2 × длина).
    piston-wall-length: 32
    # Задержка повторителей в часах стены (1–4); 2 = поршни успевают двигаться.
    piston-clock-delay: 2
    #
    # --- Цепочки воронок: замкнутое кольцо из 2 × длина воронок (предметы
    # ходят по кругу и не заканчиваются), выбрасыватель на часах из обсерверов,
    # компаратор читает воронку и гонит линию пыли по лампам.
    hopper-chains: 64
    # Длина одной стороны кольца (воронок в кольце = 2 × длина).
    hopper-chain-length: 20
    # Сколько предметов разложить по кольцу (поровну на все контейнеры).
    items-per-chain: 320
    # Длина линии пыли за компаратором.
    hopper-line-length: 24
    # Выбрасыватель в кольце, срабатывающий от часов из обсерверов.
    hopper-dropper-clock: true
    #
    # --- Петли вагонеток: квадрат из рельсов (каждый 6-й — энергорельс на
    # блоке редстоуна) с вагонетками-воронками. Сошедшие с рельсов удаляются.
    minecart-loops: 8
    # Сторона квадрата в блоках.
    minecart-loop-size: 24
    # Вагонеток на петлю (не больше половины длины петли).
    minecarts-per-loop: 16
    # Начальная скорость вагонеток (блоков за тик, 0–1).
    minecart-speed: 0.4
    #
    # --- Строительство.
    # Бюджет работы на тик (проверка/установка блока = 1), чтобы стройка
    # не выглядела как лаг сервера в замерах.
    blocks-per-tick: 4000
    # Очищать область каждой постройки перед стройкой (повторная стройка
    # на том же месте даёт ту же самую постройку).
    clear-before-build: true
    # Добавлять постройки на этапе max (см. выше).
    max-stage-extra: true

  chunks:
    enabled: true
    # «Пролёт игроков над новой местностью» без игроков: квадрат чанков вокруг
    # движущегося центра держится тикетами плагина (World#addPluginChunkTicket)
    # и грузится через World#getChunkAtAsync, ближние чанки первыми.
    # Радиус «кольца» в чанках: 24 → квадрат 49×49 = 2401 чанк (не больше 62).
    ring-radius: 24
    # Сколько новых запросов на загрузку/генерацию отправлять за тик.
    chunks-per-tick: 16
    # Максимум запросов «в полёте» одновременно (ещё не загруженных).
    max-concurrent: 96
    # Через сколько тиков центр сдвигается (на этапе max — чаще, делится на множитель).
    move-interval-ticks: 200
    # На сколько чанков центр сдвигается вдоль +Z за раз (новые чанки = генерация + свет).
    move-step-chunks: 8
    # Максимальный сдвиг вбок (по X) на каждом шаге; путь задаётся сидом и одинаков
    # на обоих серверах. 0 = прямая линия.
    max-side-shift: 8
    # Сколько вышедших из кольца чанков отпускать за тик (выгрузка + сохранение).
    # 0 = все сразу.
    releases-per-tick: 64
    # Генерировать новые чанки (true) или только грузить уже существующие.
    generate: true
    # Срочные запросы (urgent) — сервер ставит их впереди остальных. Обычно false.
    urgent: false

  packets:
    enabled: true
    # Пакетная нагрузка. Для неё нужен игрок: зайдите на сервер 1–2 аккаунтами
    # (одинаково на обоих серверах!). Пакеты получают только игроки, стоящие в
    # stress_world; без игроков работает только «мировая» часть (блоки, стойки,
    # частицы в мире). Игроки в других мирах ничего не получают.
    # Перенести каждого онлайн-игрока (один раз за прогон) на площадку модуля в
    # stress_world — так позиция игроков одинакова на обоих серверах.
    teleport-players: true
    # Сколько игроков (первые по имени) получают персональные пакеты.
    max-players: 2
    # --- на каждого игрока за тик ---
    # Пакетов частиц (Player#spawnParticle) и частиц в каждом.
    particle-packets-per-tick: 200
    particles-per-packet: 8
    # Звуков (очень тихих, громкость 0.05).
    sounds-per-tick: 50
    # Ложных блоков (только у клиента) через sendMultiBlockChange и отдельными
    # sendBlockChange. После остановки настоящие блоки отправляются обратно.
    block-changes-per-tick: 2000
    single-block-changes-per-tick: 100
    # Сообщение в action bar каждый тик.
    action-bar: true
    # --- общие для всех игроков на площадке ---
    # Боссбары (обновляются каждый тик, максимум 16).
    boss-bars: 4
    # Свой scoreboard игрокам: команды (максимум 64) и строки боковой панели (максимум 15).
    teams: 16
    team-updates-per-tick: 20
    sidebar-lines: 15
    # --- мировая часть (работает и без игроков) ---
    # Настоящих блоков «потолка» площадки, переключаемых за тик (пакеты обновления
    # блоков всем в радиусе прорисовки).
    world-block-toggles-per-tick: 256
    # Стойки для брони: сколько всего, сколько из них за тик меняют имя и подсветку
    # (метаданные), сколько двигаются каждый тик (пакеты движения).
    moving-entities: 300
    entity-updates-per-tick: 150
    entity-moves-per-tick: 300
    # Вспышек частиц через World#spawnParticle за тик и частиц в каждой.
    world-particle-bursts-per-tick: 20
    world-particles-per-burst: 50
    # Стройка площадки: блоков за тик и стоек за тик (чтобы стройка не выглядела как лаг).
    build-blocks-per-tick: 1024
    spawn-per-tick: 20

  async:
    enabled: true
    # Нагрузка «тяжёлых плагинов». Объём работы за запуск фиксирован и задан
    # сидом, поэтому одинаков на обоих серверах; на этапе max умножается.
    # Повторяющихся асинхронных задач планировщика Bukkit
    # (runTaskTimerAsynchronously, потоки «Craft Scheduler Thread»).
    scheduler-tasks: 12
    # Период каждой задачи в тиках. Если прошлый запуск ещё идёт, новый пропускается.
    scheduler-period-ticks: 1
    # Работа за один запуск: SHA-256 (КиБ), JSON (Gson) фейковых игроков, сортировка чисел.
    hash-kib-per-run: 64
    json-objects-per-run: 40
    sort-size-per-run: 20000
    # Сколько из задач пишут свой JSON в plugins/AmazakeStress/async-io/ и как часто
    # (в тиках). Папка удаляется при остановке.
    file-writers: 2
    file-write-interval-ticks: 20
    # Собственные потоки «AmazakeStress Worker #N» (как у плагинов со своими пулами)
    # и пауза между пачками работы, мс.
    threads: 2
    worker-sleep-ms: 5
    # Снимков чанков в секунду (ChunkSnapshot снимается в главном потоке из
    # фиксированной области 8×8 чанков, обрабатывается асинхронно).
    chunk-snapshots-per-second: 40
    # Колбэков «асинхронно посчитал → применил в главном потоке» за тик.
    sync-callbacks-per-tick: 100
    # «Плохо написанные плагины»: задач в главном потоке, каждая тратит
    # sync-ms-per-task мс каждый тик (на этапе max — больше), но все вместе не больше
    # sync-max-ms-total мс за тик.
    sync-tasks: 3
    sync-ms-per-task: 1.5
    sync-max-ms-total: 10.0

  races:
    enabled: true
    # «Канарейка» для многопоточных серверов. Модуль ведёт себя как обычный
    # НЕпотокобезопасный плагин: слушатели частых событий в stress_world
    # считают их в простых HashMap/ArrayList, «банк» из двух HashMap переводит
    # суммы между счетами, поле-«заначка» живёт от приоритета LOW до MONITOR.
    # Если код плагина хоть раз выполнится в двух потоках одновременно, это
    # испортит состояние, и проверка инвариантов покажет нарушения. На Paper/Leaf
    # (один поток) и на Amazake с блокировкой плагинов нарушений должно быть 0.
    # Результат: строка модуля в /stress status и объект stress.races в отчёте.
    # Какие события слушать (каждое: LOW + NORMAL + MONITOR).
    listen:
      entity-move: true       # EntityMoveEvent (Paper): каждый шаг каждого моба
      block-physics: true     # BlockPhysicsEvent: обновления блоков (редстоун, физика)
      entity-target: true     # EntityTargetEvent: выбор цели мобами
      player-move: true       # PlayerMoveEvent: игроки в stress_world
    # Задач планировщика в главном потоке (каждый тик): каждая вызывает свои
    # события-«пробы» (часть из них вложенные), делает переводы в банке и
    # проходит по списку событий. На этапе max — больше.
    sync-tasks: 2
    probe-events-per-task: 10
    transfers-per-task: 20
    # Счетов в банке и размер списка событий (при достижении список очищается).
    accounts: 64
    log-cap: 4096
    # Как часто проверять инварианты (тики); ещё проверка при смене этапа и в конце.
    check-interval-ticks: 20
