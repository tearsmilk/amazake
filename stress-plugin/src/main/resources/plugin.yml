name: AmazakeStress
version: '${version}'
main: ink.hoka.amazake.stress.StressPlugin
api-version: '1.21'
description: Воспроизводимый стресс-тест сервера Paper 1.21.11 для сравнения форков (Leaf, Amazake и др.)
authors: [Amazake]
website: https://mc-ru.org
load: POSTWORLD
folia-supported: false
commands:
  stress:
    description: Управление стресс-тестом AmazakeStress
    usage: /stress <start|stop|status|cleanup|profile>
    permission: stress.admin
permissions:
  stress.admin:
    description: Доступ ко всем командам /stress
    default: op
