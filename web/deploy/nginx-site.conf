# managed by amazake-web installer (web/deploy/install.sh). Do not edit: re-running install.sh overwrites it.
# Only requests for @DOMAIN@ land here: this file has no default_server, so other sites on this
# nginx keep working exactly as before.
# This is a template: install.sh fills in the domain, port and ACME folder, keeps either the
# HTTP-only or the HTTPS variant below, and enables the IPv6 "listen" lines when IPv6 is available.

#@BEGIN-HTTP-ONLY
server {
    listen 80;
    #@V6 listen [::]:80;
    server_name @DOMAIN@;

    # Let's Encrypt checks (certbot --webroot); certbot never edits nginx files.
    location ^~ /.well-known/acme-challenge/ {
        root @ACME_DIR@;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 9m;
    }
}
#@END-HTTP-ONLY

#@BEGIN-HTTPS
server {
    listen 80;
    #@V6 listen [::]:80;
    server_name @DOMAIN@;

    location ^~ /.well-known/acme-challenge/ {
        root @ACME_DIR@;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    #@V6 listen [::]:443 ssl;
    server_name @DOMAIN@;

    ssl_certificate     /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 9m;
    }
}
#@END-HTTPS
