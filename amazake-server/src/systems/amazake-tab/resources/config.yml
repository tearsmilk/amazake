# ============================================================================
#  AmazakeTab - таб, сайдбар и таблички над головой (система ядра Amazake)
# ============================================================================
#  Перезагрузка без рестарта: /amazake system reload AmazakeTab
#
#  Текст пишется в MiniMessage: <red>, <#ff8800>, <gradient:#ff5f6d:#ffc371>...</gradient>,
#  <bold>, <rainbow> и т.д. (https://docs.advntr.dev/minimessage/format.html).
#
#  Плейсхолдеры (везде, где есть текст):
#    %player%  ник             %displayname%  отображаемое имя   %group%  группа игрока
#    %online%  онлайн          %max%          слотов             %world%  мир
#    %tps%     TPS (до 20)     %mspt%         мс на тик          %ping%   пинг, мс
#    %x% %y% %z%  координаты   %health%       здоровье           %level%  уровень опыта
#    %time%    время ЧЧ:ММ     %date%         дата ДД.ММ.ГГГГ
#  Если установлен PlaceholderAPI, работают и его плейсхолдеры (%vault_rank%, %luckperms_prefix% ...).
#
#  Анимация: список «кадров», каждый кадр показывается interval-ticks тиков (20 тиков = 1 секунда).
#  Кадры у всех игроков переключаются одновременно.
# ============================================================================

# Как часто (в тиках) обновляется таб и сайдбар каждого игрока: плейсхолдеры, смена мира, группы.
# Меньше - отзывчивее, больше - дешевле. Анимация не может быть быстрее этого значения.
update-period-ticks: 5

# Если игроку уже поставил свой скорборд другой плагин (мини-игра, TAB ...), не трогать его скорборд
# (сайдбар, сортировку и таблички), пока тот плагин не вернёт игроку обычный. Шапка/подвал и имя в табе
# при этом продолжают работать.
respect-other-scoreboards: true

# Использовать PlaceholderAPI, если он установлен.
placeholderapi: true

# Часовой пояс для %time% и %date%, например Europe/Moscow. Пусто - пояс сервера.
time-zone: ""

# ----------------------------------------------------------------------------
#  Шапка и подвал таба
# ----------------------------------------------------------------------------
header-footer:
  enabled: true
  # Сколько тиков показывается каждый кадр.
  interval-ticks: 20
  # Каждый кадр - многострочный текст: блок «|-» или список строк.
  header:
    - |-
      <gradient:#ff5f6d:#ffc371><bold>AMAZAKE</bold></gradient>
      <gray>Онлайн: <white>%online%</white>/<white>%max%</white>
    - |-
      <gradient:#ffc371:#ff5f6d><bold>AMAZAKE</bold></gradient>
      <gray>Онлайн: <white>%online%</white>/<white>%max%</white>
  footer:
    - |-
      <gray>TPS: <green>%tps%</green>  MSPT: <green>%mspt%</green>  Пинг: <green>%ping%</green> мс
      <dark_gray>%date% %time%
  # Свои шапка/подвал для отдельных миров. Не указанные ключи берутся из настроек выше.
  # Пример:
  # worlds:
  #   world_nether:
  #     header:
  #       - "<red><bold>Незер</bold>"
  #   world_the_end:
  #     enabled: false
  worlds: {}

# ----------------------------------------------------------------------------
#  Группы. Игрок попадает в ПЕРВУЮ по порядку группу, право на которую у него есть:
#  amazake.tab.group.<имя группы> (например amazake.tab.group.admin).
#  Группа «default» подходит всем, поэтому её ставят последней.
#
#  priority    - место в табе: 0 - самый верх, 999 - самый низ (по умолчанию - порядок в списке,
#                у default - 999). Внутри группы игроки идут по нику.
#  tab-prefix / tab-suffix - префикс и суффикс в табе (вставляются в tab-names.format).
#  tag-prefix / tag-suffix - префикс и суффикс в табличке над головой. Каждое изменение рассылается всем
#                игрокам, поэтому часто меняющиеся плейсхолдеры здесь (%ping%, %health%, %x% ...) стоят
#                по пакету на каждого зрителя при каждом изменении; на большом онлайне лучше их избегать.
#  color       - цвет ника над головой: black, dark_blue, dark_green, dark_aqua, dark_red, dark_purple,
#                gold, gray, dark_gray, blue, green, aqua, red, light_purple, yellow, white.
# ----------------------------------------------------------------------------
groups:
  admin:
    priority: 0
    tab-prefix: "<red>[Админ] "
    tab-suffix: ""
    tag-prefix: "<red>[Админ] "
    tag-suffix: ""
    color: red
  moderator:
    priority: 10
    tab-prefix: "<gold>[Модер] "
    tag-prefix: "<gold>[Модер] "
    color: gold
  vip:
    priority: 20
    tab-prefix: "<green>[VIP] "
    tag-prefix: "<green>[VIP] "
    color: green
  default:
    tab-prefix: "<gray>"
    tag-prefix: ""
    color: white

# ----------------------------------------------------------------------------
#  Имена игроков в табе
# ----------------------------------------------------------------------------
tab-names:
  enabled: true
  # <prefix> и <suffix> - префикс/суффикс группы (или из Vault), <name> - ник.
  # Незакрытый цвет из префикса переходит на ник, как у обычных префиксов.
  format: "<prefix><name><suffix> <dark_gray>%ping%мс"
  # Брать префикс и суффикс из Vault (LuckPerms и т.п.), если Vault и чат-провайдер установлены.
  # Пустой префикс/суффикс из Vault заменяется префиксом/суффиксом группы.
  vault: true
  # Сортировать таб по priority групп (через команды скорборда: клиент сортирует таб по имени команды).
  sort: true

# ----------------------------------------------------------------------------
#  Сайдбар (табло справа)
# ----------------------------------------------------------------------------
sidebar:
  enabled: true
  interval-ticks: 20
  # Скрыть числа справа от строк.
  hide-numbers: true
  # Заголовок: один кадр или список кадров.
  title:
    - "<gradient:#ff5f6d:#ffc371><bold>AMAZAKE</bold></gradient>"
    - "<gradient:#ffc371:#ff5f6d><bold>AMAZAKE</bold></gradient>"
  # Строки (не больше 15). Строка - текст; список - анимированная строка (кадры с interval-ticks выше);
  # или {frames: [...], interval-ticks: N} - анимированная строка со своей скоростью.
  lines:
    - ""
    - "<gray>Игрок: <white>%player%"
    - "<gray>Группа: <white>%group%"
    - "<gray>Мир: <white>%world%"
    - "<gray>Координаты: <white>%x% %y% %z%"
    - ""
    - "<gray>Онлайн: <green>%online%<gray>/%max%"
    - "<gray>TPS: <green>%tps%"
    - ""
    - frames: ["<yellow>play.example.net", "<gold>play.example.net"]
      interval-ticks: 10
  # Свой сайдбар для отдельных миров. Не указанные ключи берутся из настроек выше.
  # Пример:
  # worlds:
  #   world_nether:
  #     enabled: false
  #   world_the_end:
  #     title: "<light_purple><bold>Энд"
  #     lines:
  #       - "<gray>Здоровье: <red>%health%"
  worlds: {}

# ----------------------------------------------------------------------------
#  Таблички над головой (префикс, суффикс, цвет ника - из групп)
# ----------------------------------------------------------------------------
nametags:
  enabled: true
  # Толкание игроков: always (как обычно), never (не толкаются),
  # push-other-teams / push-own-team (у каждого игрока своя команда, так что «своя» - только он сам).
  collision: always
  # Видимость табличек: always, never, hide-for-other-teams (другим не видна), hide-for-own-team.
  visibility: always
