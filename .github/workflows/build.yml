name: Build Amazake

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  # Publishing a release from main needs to write.
  contents: write

jobs:
  build:
    # A PR from this repository is already built by its push.
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Profiler site tests (backend, installer scripts)
        run: |
          python3 -m unittest discover -s web/server -v
          bash -n web/deploy/install.sh web/deploy/uninstall.sh scripts/smoke-test.sh
          shellcheck web/deploy/install.sh web/deploy/uninstall.sh scripts/smoke-test.sh

      - name: Git user (paperweight applies patches as commits)
        run: git config --global user.email "actions@github.com" && git config --global user.name "GitHub Actions"

      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace --no-daemon

      - name: Patch tasks (for the README)
        run: ./gradlew tasks --all --no-daemon | grep -iE "(^|:)(apply|rebuild|fixup)[A-Za-z]* " || true

      - name: Build the server jar
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # Paper writes this into the jar as its build time (else 1970-01-01).
          export BUILD_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ./gradlew createMojmapPaperclipJar --stacktrace --no-daemon

      - name: The jar says it is Amazake
        run: |
          jar=$(ls amazake-server/build/libs/amazake-paperclip-*-mojmap.jar)
          echo "Built $jar"
          unzip -p "$jar" META-INF/MANIFEST.MF || true

      - name: Smoke test (start, commands, stop)
        run: scripts/smoke-test.sh amazake-server/build/libs/amazake-paperclip-*-mojmap.jar

      - uses: actions/upload-artifact@v4
        with:
          name: amazake-${{ github.run_number }}
          path: amazake-server/build/libs/amazake-paperclip-*-mojmap.jar
          retention-days: 30

      - name: Publish the build as a release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls amazake-server/build/libs/amazake-paperclip-*-mojmap.jar)
          name="amazake-1.21.11-${{ github.run_number }}.jar"
          cp "$jar" "$name"
          gh release create "build-${{ github.run_number }}" "$name" \
            --target "$GITHUB_SHA" \
            --title "Amazake 1.21.11 #${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)" \
            --latest
