name: Build Amazake

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  # Publishing a release from main needs to write.
  contents: write

jobs:
  build:
    # A PR from this repository is already built by its push.
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Profiler site tests (backend, installer scripts)
        run: |
          python3 -m unittest discover -s web/server -v
          bash -n web/deploy/install.sh web/deploy/uninstall.sh scripts/smoke-test.sh
          shellcheck web/deploy/install.sh web/deploy/uninstall.sh scripts/smoke-test.sh \
            scripts/systems-api-docs.sh systems-template/deploy.sh
          # docs/systems.md carries the systems API sources: they must match the code.
          scripts/systems-api-docs.sh --check

      - name: Git user (paperweight applies patches as commits)
        run: git config --global user.email "actions@github.com" && git config --global user.name "GitHub Actions"

      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace --no-daemon

      - name: Patch tasks (for the README)
        run: ./gradlew tasks --all --no-daemon | grep -iE "(^|:)(apply|rebuild|fixup)[A-Za-z]* " || true

      - name: Build the server jar
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # Paper writes this into the jar as its build time (else 1970-01-01).
          export BUILD_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ./gradlew createMojmapPaperclipJar --stacktrace --no-daemon

      - name: Unit tests (Amazake's own and the built-in systems)
        run: ./gradlew :amazake-server:test --tests 'core.amazake.AmazakeTestSuite' :amazake-server:testAmazakeTab --stacktrace --no-daemon

      - name: The systems API jar and the built-in systems
        run: |
          ./gradlew :amazake-server:systemsApiJar --stacktrace --no-daemon
          ls -l amazake-server/build/libs/amazake-systems-api-*.jar
          unzip -l "$(ls amazake-server/build/libs/amazake-systems-api-*.jar | grep -v -- '-sources\.jar$')"
          # AmazakeTab ships as a resource (systems/AmazakeTab.azs) and must not be on the server's own classpath.
          server=$(ls amazake-server/build/libs/amazake-server-*.jar)
          unzip -l "$server" systems/AmazakeTab.azs
          if unzip -l "$server" | grep -q 'core/amazake/systems/tab/'; then
            echo "AmazakeTab classes are on the server classpath"; exit 1
          fi

      - name: The jar says it is Amazake
        run: |
          jar=$(ls amazake-server/build/libs/amazake-paperclip-*-mojmap.jar)
          echo "Built $jar"
          unzip -p "$jar" META-INF/MANIFEST.MF || true

      - name: Build the AmazakeStress plugin (stress-plugin/, public Paper API only)
        run: |
          ./gradlew -p stress-plugin build --stacktrace --no-daemon
          ls -l stress-plugin/build/libs/
          unzip -p stress-plugin/build/libs/AmazakeStress-*.jar plugin.yml

      - name: Build the system template (systems-template/) against this build's systems API
        run: |
          api=$(ls amazake-server/build/libs/amazake-systems-api-*.jar | grep -v -- '-sources\.jar$')
          (cd systems-template && ./gradlew build -PamazakeApiJar="$GITHUB_WORKSPACE/$api" --stacktrace --no-daemon)
          unzip -l systems-template/build/libs/Example.azs
          unzip -p systems-template/build/libs/Example.azs system.yml

      - name: Smoke test (start, commands, systems, /stress run 40 with the plugin, stop)
        run: |
          scripts/smoke-test.sh amazake-server/build/libs/amazake-paperclip-*-mojmap.jar \
            "$(ls stress-plugin/build/libs/AmazakeStress-*.jar)" systems-template/build/libs/Example.azs

      - uses: actions/upload-artifact@v4
        with:
          name: amazake-${{ github.run_number }}
          path: amazake-server/build/libs/amazake-paperclip-*-mojmap.jar
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: amazake-systems-api-${{ github.run_number }}
          path: amazake-server/build/libs/amazake-systems-api-*.jar
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: amazake-stress-${{ github.run_number }}
          path: stress-plugin/build/libs/AmazakeStress-*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish the build as a release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls amazake-server/build/libs/amazake-paperclip-*-mojmap.jar)
          name="amazake-1.21.11-${{ github.run_number }}.jar"
          cp "$jar" "$name"
          # The stress plugin rides along: AmazakeStress-<version>.jar runs on any Paper 1.21.11 fork (Leaf too).
          stress=$(ls stress-plugin/build/libs/AmazakeStress-*.jar)
          cp "$stress" .
          # The API for writing Amazake systems (.azs), with its sources.
          api="amazake-systems-api-1.21.11-${{ github.run_number }}.jar"
          api_sources="amazake-systems-api-1.21.11-${{ github.run_number }}-sources.jar"
          cp "$(ls amazake-server/build/libs/amazake-systems-api-*.jar | grep -v -- '-sources\.jar$')" "$api"
          cp amazake-server/build/libs/amazake-systems-api-*-sources.jar "$api_sources"
          # The same jar under a fixed name: systems-template/ downloads releases/latest/download/amazake-systems-api.jar.
          cp "$api" amazake-systems-api.jar
          # The template for writing a system, ready to unpack and build.
          (git archive --format=zip --prefix=amazake-system-template/ HEAD:systems-template > amazake-system-template.zip)
          gh release create "build-${{ github.run_number }}" "$name" "$(basename "$stress")" "$api" "$api_sources" \
            amazake-systems-api.jar amazake-system-template.zip \
            --target "$GITHUB_SHA" \
            --title "Amazake 1.21.11 #${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)" \
            --latest
